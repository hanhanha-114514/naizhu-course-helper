<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8fb"/>
      <stop offset="1" stop-color="#fbeef2"/>
    </linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#c9748f"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#f0c2ce; stroke-width:1.4; }
      .term { fill:#fff1f5; stroke:#e79ab0; stroke-width:1.6; }
      .t1 { font-size:16px; font-weight:700; fill:#5b3d47; }
      .t2 { font-size:13px; fill:#8a6b75; }
      .lbl { font-size:13px; font-weight:700; fill:#c05f7d; }
      .ln { stroke:#c9748f; stroke-width:1.6; fill:none; marker-end:url(#ar); }
    </style>
  </defs>

  <rect width="1200" height="780" fill="url(#bg2)"/>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#5b3d47">自动切换下一章 / 自动翻页的执行顺序</text>
  <text x="60" y="78" font-size="15" fill="#9c7b86">实线为判定通过的路径，虚线为失败重试</text>

  <rect class="term" x="60" y="100" width="210" height="64" rx="14"/>
  <text class="t1" x="80" y="132">计时累计 ≥ 要求学时</text>
  <text class="t2" x="80" y="152">触发切换检查</text>

  <rect class="box" x="310" y="100" width="250" height="64" rx="14"/>
  <text class="t1" x="330" y="132">关闭播放器</text>
  <text class="t2" x="330" y="152">点站点自己的关闭链接，平台在此刻记录学时</text>

  <rect class="box" x="600" y="100" width="250" height="64" rx="14"/>
  <text class="t1" x="620" y="132">本地登记已完成章节</text>
  <text class="t2" x="620" y="152">按课程 Id + 章节名排除，不依赖服务器刷新</text>

  <polygon class="box" points="725,196 875,250 725,304 575,250"/>
  <text class="t1" x="725" y="246" text-anchor="middle">当前页还有</text>
  <text class="t1" x="725" y="266" text-anchor="middle">未完成章节？</text>

  <rect class="box" x="60" y="330" width="230" height="64" rx="14"/>
  <text class="t1" x="80" y="362">点击章节链接</text>
  <text class="t2" x="80" y="382">showframe(章节名, Id)</text>

  <rect class="box" x="60" y="450" width="230" height="64" rx="14"/>
  <text class="t1" x="80" y="482">校验是否真的打开</text>
  <text class="t2" x="80" y="502">弹窗内 ExamView 的 Id == 目标 Id</text>

  <rect class="term" x="60" y="580" width="230" height="70" rx="14"/>
  <text class="t1" x="80" y="612">进入下一章</text>
  <text class="t2" x="80" y="632">播放守护接管，继续计时</text>

  <rect class="box" x="340" y="450" width="230" height="64" rx="14"/>
  <text class="t1" x="360" y="482">重新获取链接并重试</text>
  <text class="t2" x="360" y="502">最多 3 次，仍失败则提示手动开始</text>

  <rect class="box" x="880" y="330" width="260" height="64" rx="14"/>
  <text class="t1" x="900" y="362">提交翻页</text>
  <text class="t2" x="900" y="382">写 __EVENTTARGET 后提交分页表单</text>

  <polygon class="box" points="1010,430 1140,482 1010,534 880,482"/>
  <text class="t1" x="1010" y="478" text-anchor="middle">列表内容</text>
  <text class="t1" x="1010" y="498" text-anchor="middle">指纹真的变化？</text>

  <rect class="term" x="880" y="580" width="260" height="70" rx="14"/>
  <text class="t1" x="900" y="612">再翻页或结束</text>
  <text class="t2" x="900" y="632">最多再试 3 次；仍无变化则提示可能已到最后一页</text>

  <line class="ln" x1="270" y1="132" x2="310" y2="132"/>
  <line class="ln" x1="560" y1="132" x2="600" y2="132"/>
  <line class="ln" x1="725" y1="164" x2="725" y2="196"/>

  <polyline class="ln" points="575,250 175,250 175,330"/>
  <text class="lbl" x="330" y="240">是</text>
  <line class="ln" x1="175" y1="394" x2="175" y2="450"/>
  <line class="ln" x1="175" y1="514" x2="175" y2="580"/>
  <text class="lbl" x="186" y="556">是</text>

  <line class="ln" x1="290" y1="470" x2="340" y2="470"/>
  <text class="lbl" x="296" y="462">否</text>
  <line x1="340" y1="496" x2="290" y2="496" stroke="#c9748f" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)"/>
  <text class="t2" x="296" y="514">重试</text>

  <polyline class="ln" points="875,250 1010,250 1010,330"/>
  <text class="lbl" x="900" y="240">否</text>
  <line class="ln" x1="1010" y1="394" x2="1010" y2="430"/>
  <line class="ln" x1="1010" y1="534" x2="1010" y2="580"/>
  <text class="lbl" x="1020" y="562">否</text>

  <polyline class="ln" points="880,482 745,482 745,304"/>
  <text class="lbl" x="790" y="474">是，回到查找</text>

  <rect x="60" y="690" width="1080" height="60" rx="14" fill="#fff5f8" stroke="#f2d2db"/>
  <text class="t1" x="82" y="716">为什么顺序是"先关闭、再登记、后切换"</text>
  <text class="t2" x="82" y="738">平台只在播放器被关闭时更新该章节的已完成学时；若只隐藏播放器，章节状态仍是"学习中"，切换时又会点回同一章，形成循环。</text>
</svg>
